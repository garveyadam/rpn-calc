<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RPN Calc — App Icon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 100% at 50% 0%, #0b2c45 0%, #061726 55%, #02080f 100%);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: #eaf4ff; display: flex; align-items: center; justify-content: center;
    padding: 64px 24px;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 48px; max-width: 720px; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .hero img {
    width: 240px; height: 240px; border-radius: 53.67px; /* 22.37% squircle approx */
    box-shadow: 0 30px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .hero h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .hero p { font-size: 14px; color: rgba(190,227,255,0.55); margin-top: -8px; }

  .sizes { display: flex; align-items: flex-end; gap: 36px; flex-wrap: wrap; justify-content: center; }
  .size { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .size img { border-radius: 22.37%; box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.05); }
  .size span { font-size: 11.5px; color: rgba(190,227,255,0.5); font-weight: 500; }
  .s180 { width: 120px; height: 120px; }
  .s120 { width: 84px; height: 84px; }
  .s87  { width: 60px; height: 60px; }
  .s60  { width: 44px; height: 44px; }

  .home {
    margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 9px;
  }
  .home .tile { width: 76px; height: 76px; border-radius: 17px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
  .home .label { font-size: 12px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.08); }
  .caption { font-size: 12.5px; color: rgba(190,227,255,0.45); text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <img src="swiftui/AppIcon/appicon-1024.png" alt="RPN Calc app icon" />
      <h1>RPN Calc</h1>
      <p>1024 × 1024 · App Store icon</p>
    </div>

    <div class="divider"></div>

    <div class="sizes">
      <div class="size"><img class="s180" src="swiftui/AppIcon/appicon-1024.png" /><span>180 · iPhone</span></div>
      <div class="size"><img class="s120" src="swiftui/AppIcon/appicon-1024.png" /><span>120 · Spotlight</span></div>
      <div class="size"><img class="s87"  src="swiftui/AppIcon/appicon-1024.png" /><span>87 · Settings</span></div>
      <div class="size"><img class="s60"  src="swiftui/AppIcon/appicon-1024.png" /><span>60 · Notification</span></div>
    </div>

    <div class="home">
      <div class="tile" style="background-image:url('swiftui/AppIcon/appicon-1024.png');background-size:cover;"></div>
      <div class="label">RPN Calc</div>
    </div>

    <p class="caption">Masked previews use iOS's ~22.4% superellipse radius.<br/>The source PNG is square &amp; opaque — iOS applies the mask.</p>
  </div>
</body>
</html>
